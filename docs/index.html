<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日振島 釣果まとめ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    /* ─── Header ─── */
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
      color: white;
      padding: 12px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header .subtitle { font-size: 11px; opacity: 0.8; margin-top: 2px; }
    #update-time { font-size: 10px; opacity: 0.6; margin-top: 2px; }

    /* ─── Filters ─── */
    .filters {
      background: white;
      padding: 8px 12px;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 54px;
      z-index: 90;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-row + .filter-row { margin-top: 6px; }
    .filter-btn {
      padding: 4px 10px;
      border: 1.5px solid #cbd5e0;
      border-radius: 16px;
      background: white;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: #2d6a9f; color: #2d6a9f; }
    .filter-btn.active {
      background: #2d6a9f;
      color: white;
      border-color: #2d6a9f;
    }
    .filter-label {
      font-size: 11px;
      color: #718096;
      font-weight: 600;
    }

    .date-chip {
      padding: 4px 10px;
      border: 1.5px solid #cbd5e0;
      border-radius: 16px;
      background: white;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .date-chip.active { background: #2d6a9f; color: white; border-color: #2d6a9f; }

    .date-input-mini {
      padding: 3px 4px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 12px;
      width: 110px;
      color: #4a5568;
      background: white;
    }
    .date-input-mini::-webkit-date-and-time-value { text-align: left; }

    .view-toggle {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }
    .view-btn {
      padding: 4px 8px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 13px;
    }
    .view-btn.active { background: #2d6a9f; color: white; border-color: #2d6a9f; }

    /* ─── Stats bar ─── */
    .stats-bar {
      padding: 6px 12px;
      background: #edf2f7;
      font-size: 11px;
      color: #718096;
      display: flex;
      justify-content: space-between;
    }

    /* ─── Main ─── */
    main { padding: 8px; max-width: 1200px; margin: 0 auto; }

    /* ─── Date group ─── */
    .date-group { margin-bottom: 16px; }
    .date-header {
      font-size: 14px;
      font-weight: 700;
      color: #2d3748;
      padding: 6px 4px;
      border-bottom: 2px solid #2d6a9f;
      margin-bottom: 8px;
    }
    .date-header .day-of-week {
      font-size: 11px;
      font-weight: 400;
      color: #718096;
      margin-left: 6px;
    }

    /* ─── Thumbnail Grid ─── */
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .thumb-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: #e2e8f0;
      aspect-ratio: 1;
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-source {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 600;
      color: white;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
    }
    .thumb-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.55);
      color: white;
      padding: 1px 5px;
      border-radius: 8px;
      font-size: 9px;
    }
    .thumb-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #a0aec0;
    }
    .thumb-noimg {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      text-align: center;
    }
    .thumb-noimg .fish { font-size: 20px; opacity: 0.4; }
    .thumb-noimg .label {
      font-size: 9px;
      color: #a0aec0;
      margin-top: 2px;
      line-height: 1.2;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* PC: larger grid */
    @media (min-width: 600px) {
      .thumb-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    }
    @media (min-width: 900px) {
      .thumb-grid { grid-template-columns: repeat(6, 1fr); gap: 8px; }
      .thumb-item { border-radius: 10px; }
    }

    /* ─── Modal ─── */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      flex-direction: column;
    }
    .modal-overlay.show { display: flex; }

    .modal-header {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-close {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }
    .modal-info {
      color: white;
      flex: 1;
    }
    .modal-info .source-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
    }
    .modal-info h2 {
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
      line-height: 1.3;
    }
    .modal-info .meta {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
    }

    .modal-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 0 16px;
    }
    .modal-scroll img {
      width: 100%;
      display: block;
      margin-bottom: 2px;
    }
    .modal-text {
      padding: 12px;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .modal-link {
      display: inline-block;
      margin: 0 12px 12px;
      color: #63b3ed;
      text-decoration: none;
      font-size: 12px;
    }

    /* ─── Source tag colors ─── */
    .source-yoshida { background: #ebf8ff; color: #2b6cb0; }
    .source-miura { background: #f0fff4; color: #276749; }
    .source-wakashio { background: #fefcbf; color: #975a16; }
    .source-seike { background: #fed7e2; color: #97266d; }
    .source-hamakaze { background: #e9d8fd; color: #553c9a; }

    /* ─── Empty / Loading ─── */
    .empty { text-align: center; padding: 60px 20px; color: #a0aec0; }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }
    .loading { text-align: center; padding: 60px; color: #718096; }
  </style>
</head>
<body>

<header>
  <h1>日振島 釣果まとめ</h1>
  <div class="subtitle">愛媛県宇和島市 - 渡船屋の釣果情報を一覧で</div>
  <div id="update-time"></div>
</header>

<div class="filters">
  <div class="filter-row">
    <div id="source-filters" style="display:flex;gap:4px;flex-wrap:wrap;">
      <button class="filter-btn active" data-source="all">ALL</button>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" data-view="date" title="日付順">&#x1f4c5;</button>
      <button class="view-btn" data-view="source" title="渡船別">&#x1f6a2;</button>
    </div>
  </div>
  <div class="filter-row">
    <span class="filter-label">期間:</span>
    <span class="date-chip active" id="date-all">ALL</span>
    <input type="date" class="date-input-mini" id="date-from">
    <span style="color:#718096;font-size:11px">〜</span>
    <input type="date" class="date-input-mini" id="date-to">
    <span class="date-chip" id="date-clear" style="font-size:10px;color:#e53e3e;border-color:#fed7d7">解除</span>
  </div>
</div>

<div class="stats-bar">
  <span id="stats-count"></span>
  <span id="stats-range"></span>
</div>

<main id="content">
  <div class="loading">読み込み中...</div>
</main>

<!-- Modal (fullscreen on mobile) -->
<div class="modal-overlay" id="modal">
  <div class="modal-header">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-info">
      <span class="source-tag" id="modal-source"></span>
      <h2 id="modal-title"></h2>
      <div class="meta" id="modal-meta"></div>
    </div>
  </div>
  <div class="modal-scroll" id="modal-scroll">
    <div id="modal-images"></div>
    <div class="modal-text" id="modal-content"></div>
    <a class="modal-link" id="modal-link" href="#" target="_blank">元のページを見る →</a>
  </div>
</div>

<script>
let allData = [];
let currentSource = "all";
let currentView = "date";

const SOURCE_CLASS = {
  "よしだ屋": "source-yoshida",
  "三浦渡船": "source-miura",
  "わかしお渡船": "source-wakashio",
  "清家渡船": "source-seike",
  "はまかぜ渡船": "source-hamakaze",
};
const SOURCE_SHORT = {
  "よしだ屋": "よしだ屋",
  "三浦渡船": "三浦",
  "わかしお渡船": "わかしお",
  "清家渡船": "清家",
  "はまかぜ渡船": "はまかぜ",
};
const DAYS = ["日", "月", "火", "水", "木", "金", "土"];

function getDayOfWeek(dateStr) {
  return DAYS[new Date(dateStr + "T00:00:00").getDay()];
}
function formatDate(dateStr) {
  const p = dateStr.split("-");
  return `${parseInt(p[1])}/${parseInt(p[2])}（${getDayOfWeek(dateStr)}）`;
}
function formatDateLong(dateStr) {
  const p = dateStr.split("-");
  return `${parseInt(p[1])}月${parseInt(p[2])}日（${getDayOfWeek(dateStr)}）`;
}

async function loadData() {
  try {
    const [resp, metaResp] = await Promise.all([fetch("chouka.json"), fetch("meta.json")]);
    allData = await resp.json();
    const meta = await metaResp.json();
    document.getElementById("update-time").textContent =
      `更新: ${new Date(meta.updated_at).toLocaleString("ja-JP")}`;

    // Source filter buttons
    const sources = [...new Set(allData.map(d => d.source))];
    const sf = document.getElementById("source-filters");
    sources.forEach(s => {
      const btn = document.createElement("button");
      btn.className = "filter-btn";
      btn.dataset.source = s;
      btn.textContent = SOURCE_SHORT[s] || s;
      sf.appendChild(btn);
    });

    // Date range: set defaults
    const dates = allData.map(d => d.date).sort();
    if (dates.length > 0) {
      document.getElementById("date-from").value = dates[0];
      document.getElementById("date-to").value = dates[dates.length - 1];
    }

    render();
  } catch (e) {
    document.getElementById("content").innerHTML =
      `<div class="empty"><div class="icon">&#x26a0;</div><p>データの読み込みに失敗しました</p></div>`;
  }
}

function getFiltered() {
  const from = document.getElementById("date-from").value;
  const to = document.getElementById("date-to").value;
  const isAll = document.getElementById("date-all").classList.contains("active");

  return allData.filter(d => {
    if (currentSource !== "all" && d.source !== currentSource) return false;
    if (!isAll) {
      if (from && d.date < from) return false;
      if (to && d.date > to) return false;
    }
    return true;
  });
}

function render() {
  const data = getFiltered();
  const main = document.getElementById("content");

  document.getElementById("stats-count").textContent = `${data.length} 件`;
  const dr = data.map(d => d.date).sort();
  document.getElementById("stats-range").textContent = dr.length > 0
    ? `${formatDate(dr[0])} 〜 ${formatDate(dr[dr.length - 1])}` : "";

  if (data.length === 0) {
    main.innerHTML = `<div class="empty"><div class="icon">&#x1f3a3;</div><p>該当する釣果情報がありません</p></div>`;
    return;
  }

  if (currentView === "date") renderByDate(data, main);
  else renderBySource(data, main);
}

function renderByDate(data, container) {
  const groups = {};
  data.forEach(d => { (groups[d.date] = groups[d.date] || []).push(d); });
  const sorted = Object.keys(groups).sort().reverse();
  container.innerHTML = sorted.map(date =>
    `<div class="date-group">
      <div class="date-header">${formatDateLong(date)}<span class="day-of-week">${date}</span></div>
      <div class="thumb-grid">${groups[date].map(thumbHTML).join("")}</div>
    </div>`
  ).join("");
}

function renderBySource(data, container) {
  const groups = {};
  data.forEach(d => { (groups[d.source] = groups[d.source] || []).push(d); });
  container.innerHTML = Object.keys(groups).map(source =>
    `<div class="date-group">
      <div class="date-header">${source}</div>
      <div class="thumb-grid">${groups[source].map(thumbHTML).join("")}</div>
    </div>`
  ).join("");
}

function thumbHTML(item) {
  const cls = SOURCE_CLASS[item.source] || "";
  const short = SOURCE_SHORT[item.source] || item.source;
  const json = JSON.stringify(item).replace(/'/g, "&#39;").replace(/</g, "\\x3c");

  if (item.images.length > 0) {
    const badge = item.images.length > 1
      ? `<span class="thumb-badge">${item.images.length}</span>` : "";
    return `<div class="thumb-item" onclick='openModal(${json})'>
      <img src="${item.images[0]}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=thumb-noimg><span class=fish>&#x1f41f;</span></div>'">
      ${badge}
      <div class="thumb-source">${short}</div>
    </div>`;
  }

  return `<div class="thumb-item" onclick='openModal(${json})'>
    <div class="thumb-noimg">
      <span class="fish">&#x1f41f;</span>
      <span class="label">${item.title || short}</span>
    </div>
    <div class="thumb-source">${short}</div>
  </div>`;
}

function openModal(item) {
  const cls = SOURCE_CLASS[item.source] || "";
  const ms = document.getElementById("modal-source");
  ms.className = `source-tag ${cls}`;
  ms.textContent = item.source;
  document.getElementById("modal-title").textContent = item.title || "";
  document.getElementById("modal-meta").textContent = formatDateLong(item.date);
  document.getElementById("modal-content").textContent = item.body || "";
  document.getElementById("modal-link").href = item.url;
  document.getElementById("modal-images").innerHTML =
    item.images.map(src => `<img src="${src}" alt="" loading="lazy">`).join("");
  document.getElementById("modal-scroll").scrollTop = 0;
  document.getElementById("modal").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
  document.body.style.overflow = "";
}

// ─── Events ─── //
document.getElementById("source-filters").addEventListener("click", e => {
  if (!e.target.classList.contains("filter-btn")) return;
  document.querySelectorAll("#source-filters .filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentSource = e.target.dataset.source;
  render();
});

document.getElementById("date-all").addEventListener("click", () => {
  const el = document.getElementById("date-all");
  el.classList.add("active");
  render();
});
document.getElementById("date-from").addEventListener("change", () => {
  document.getElementById("date-all").classList.remove("active");
  render();
});
document.getElementById("date-to").addEventListener("change", () => {
  document.getElementById("date-all").classList.remove("active");
  render();
});
document.getElementById("date-clear").addEventListener("click", () => {
  const dates = allData.map(d => d.date).sort();
  if (dates.length > 0) {
    document.getElementById("date-from").value = dates[0];
    document.getElementById("date-to").value = dates[dates.length - 1];
  }
  document.getElementById("date-all").classList.add("active");
  render();
});

document.querySelectorAll(".view-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentView = btn.dataset.view;
    render();
  });
});

document.getElementById("modal").addEventListener("click", e => {
  if (e.target === document.getElementById("modal") || e.target.classList.contains("modal-header")) closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

loadData();
</script>
</body>
</html>
